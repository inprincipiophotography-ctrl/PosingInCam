# Copy this file to poses/p-NNN-<your-slug>.yaml when authoring a new pose.
# Schema reference: docs/POSE_SCHEMA.md
# Validate locally: posingincam validate poses/p-NNN-<your-slug>.yaml

id: P-XXX                                  # next free P-NNN; check poses/ for collisions
slug: your-slug-here                       # kebab-case, must match the filename
title: Your Pose Title Here                # ≤ 60 chars
pack: essential                            # essential | wedding-day | engagement | ...
illustration: assets/illustrations/your-slug-here.svg

positioning:
  her:
    - First observable instruction.
    - Second observable instruction.
  him:
    - First observable instruction.
    - Second observable instruction.

camera_notes:
  lens: 35mm or 50mm prime
  aperture: f/2.0
  angle: Eye level.
  distance: 8–12 ft.

verbal_cue: |
  "Say this exact sentence to the couple.
   Two short sentences max. ≤ 240 chars total."

# Optional fields below
difficulty: 1                              # 1 (easy) .. 3 (advanced)
tags: []                                   # see docs/POSE_SCHEMA.md for the registered set
variations: []
authored_by: ""
art_credit: ""
version: 1
