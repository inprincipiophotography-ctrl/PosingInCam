[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "posingincam"
version = "0.0.1"
description = "Posing reference cards on the back of your camera. No phone."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "TBD" }
authors = [{ name = "PosingInCam contributors" }]
keywords = ["photography", "posing", "camera", "wedding", "couples"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "pillow>=10.2",
    "piexif>=1.1.3",
    "cairosvg>=2.7",
    "jinja2>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-tools>=7.4",
    "imagehash>=4.3",
]

[project.scripts]
posingincam = "posingincam.cli.main:app"

[project.urls]
Homepage = "https://github.com/inprincipiophotography-ctrl/posingincam"
Issues = "https://github.com/inprincipiophotography-ctrl/posingincam/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/posingincam"]

[tool.hatch.build.targets.wheel.force-include]
"src/posingincam/cameras/profiles" = "posingincam/cameras/profiles"
"src/posingincam/render/templates" = "posingincam/render/templates"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RET", "C4", "PT"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/posingincam/cli/**" = ["B008"]  # Typer requires call-in-defaults

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["piexif.*", "cairosvg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=posingincam --cov-report=term-missing"
