# Camera profile template. Copy and fill when adding support for a new camera.
# Process: docs/CAMERA_COMPATIBILITY.md §"Adding a new camera profile"
# Test:    docs/CAMERA_TEST_PROTOCOL.md

id: vendor-bodyid                          # kebab-case, e.g. sony-a7iv
display_name: Vendor Body Name             # e.g. Sony Alpha 7 IV
manufacturer: Vendor                       # e.g. Sony

dcf:
  folder_number: 199                       # 100..999; default 199 to avoid colliding with user counter
  folder_tag: XXXXX                        # 5 alphanumeric chars, vendor convention (MSDCF, CANON, NCZ_8, _FUJI)
  file_prefix: XXXX                        # 4 alphanumeric chars, vendor convention (DSC0, IMG_, DSC_, DSCF)
  starting_index: 1                        # files start at <prefix>0001.JPG

image:
  width: 3840                              # output JPEG width in pixels
  height: 2560                             # output JPEG height in pixels
  jpeg_quality: 85                         # 1..100 (Pillow scale)
  color_space: sRGB

exif:
  make: Vendor                             # Make tag value
  model: BodyId                            # Model tag value
  software: posingincam/0.1
  date_time_original: "2000:01:01 00:00:01"   # frozen so cards sort outside real shoots
  spoof_make_model: true                   # if true, output reports as taken by this body

notes: |
  Tested on firmware X.YZ.
  Cards display in playback / grid view / zoom (yes/no/yes).
  Any quirks documented here.
